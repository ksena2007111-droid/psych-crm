<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Клиенты — CRM Психолога</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-logo">🧠 PsychCRM</div>
        <nav>
            <div class="nav-group-title">Клиенты</div>
            <a href="/clients" class="nav-link active">👥 Клиенты</a>
            <a href="/calendar" class="nav-link">📅 Календарь</a>
            <a href="/bookings" class="nav-link">📋 Бронирования</a>
            <div class="nav-group-title">Настройки</div>
            <a href="/services" class="nav-link">💼 Услуги</a>
            <a href="/schedule" class="nav-link">🕐 Расписание</a>
        </nav>
        <div class="sidebar-footer">
            <a href="/logout" class="nav-link logout">🚪 Выйти</a>
        </div>
    </aside>
    <main class="content">
        <div class="page-header">
            <h1>Клиенты</h1>
            <button class="btn btn-primary" onclick="openModal('modal-add-client')">+ Добавить клиента</button>
        </div>

        <div class="search-bar">
            <input type="text" id="search" placeholder="Поиск по имени или телефону..." oninput="filterClients()">
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Имя</th>
                        <th>Телефон</th>
                        <th>Возраст</th>
                        <th>Статус</th>
                        <th>Дата добавления</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="clients-list">
                    <tr><td colspan="6" style="text-align:center;color:#999">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Модальное окно добавления клиента -->
<div class="modal-overlay" id="modal-add-client">
    <div class="modal">
        <h2>Добавить клиента</h2>
        <div class="form-group">
            <label>Имя *</label>
            <input type="text" id="new-name" placeholder="Иванова Мария">
        </div>
        <div class="form-group">
            <label>Телефон</label>
            <input type="text" id="new-phone" placeholder="+375291234567">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="new-email" placeholder="client@mail.com">
        </div>
        <div class="form-group">
            <label>Возраст</label>
            <input type="number" id="new-age" placeholder="25">
        </div>
        <div class="form-group">
            <label>Пол</label>
            <select id="new-gender">
                <option value="">Не указан</option>
                <option value="female">Женский</option>
                <option value="male">Мужской</option>
            </select>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal('modal-add-client')">Отмена</button>
            <button class="btn btn-primary" onclick="addClient()">Добавить</button>
        </div>
    </div>
</div>

<script src="/static/script.js"></script>
<script>
let allClients = [];

async function loadClients() {
    try {
        allClients = await api('GET', '/clients');
        renderClients(allClients);
    } catch(e) {
        document.getElementById('clients-list').innerHTML =
            '<tr><td colspan="6" style="text-align:center;color:#e44">Ошибка загрузки</td></tr>';
    }
}

function renderClients(clients) {
    const tbody = document.getElementById('clients-list');
    if (!clients.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999">Нет клиентов</td></tr>';
        return;
    }
    tbody.innerHTML = clients.map(c => `
        <tr style="cursor:pointer" onclick="window.location='/clients/${c.id}'">
            <td><strong>${c.name}</strong></td>
            <td>${c.phone || '—'}</td>
            <td>${c.birth_date ? calcAge(c.birth_date) + ' лет' : '—'}</td>
            <td>${statusBadge(c.status)}</td>
            <td>${new Date(c.created_at).toLocaleDateString('ru-RU')}</td>
            <td>
                <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteClient(${c.id})">Удалить</button>
            </td>
        </tr>
    `).join('');
}

function filterClients() {
    const q = document.getElementById('search').value.toLowerCase();
    renderClients(allClients.filter(c =>
        c.name.toLowerCase().includes(q) ||
        (c.phone && c.phone.toLowerCase().includes(q))
    ));
}

async function addClient() {
    const data = {
        name: document.getElementById('new-name').value,
        phone: document.getElementById('new-phone').value || null,
        email: document.getElementById('new-email').value || null,
        age: parseInt(document.getElementById('new-age').value) || null,
        gender: document.getElementById('new-gender').value || null,
    };
    if (!data.name) { alert('Введите имя'); return; }
    try {
        await api('POST', '/clients', data);
        closeModal('modal-add-client');
        loadClients();
    } catch(e) { alert(e.message); }
}

async function deleteClient(id) {
    if (!confirm('Удалить клиента?')) return;
    try {
        await api('DELETE', `/clients/${id}`);
        loadClients();
    } catch(e) { alert(e.message); }
}

function calcAge(birthDate) {
    const today = new Date();
    const birth = new Date(birthDate);
    let age = today.getFullYear() - birth.getFullYear();
    const m = today.getMonth() - birth.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
    return age;
}

loadClients();
</script>
</body>
</html>

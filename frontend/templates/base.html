<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CRM Психолога{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if request.cookies.get('token') %}
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-logo">🧠 PsychCRM</div>
        <nav>
            <div class="nav-group-title">Клиенты</div>
            <a href="/clients" class="nav-link">👥 Клиенты</a>
            <a href="/calendar" class="nav-link">📅 Календарь</a>
            <a href="/bookings" class="nav-link">📋 Бронирования</a>
            <div class="nav-group-title">Настройки</div>
            <a href="/services" class="nav-link">💼 Услуги</a>
            <a href="/schedule" class="nav-link">🕐 Расписание</a>
        </nav>
        <div class="sidebar-footer">
            <a href="/logout" class="nav-link logout">🚪 Выйти</a>
        </div>
    </aside>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</div>
{% else %}
    {% block auth_content %}{% endblock %}
{% endif %}
<script src="/static/script.js"></script>
</body>
</html>
